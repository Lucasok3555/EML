<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerWallet - WebRTC Crypto P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.6); }
        }
        .mining-active { animation: pulse-glow 2s infinite; }

        @keyframes gift-bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-8deg); }
            75% { transform: scale(1.15) rotate(8deg); }
        }
        .gift-ready { animation: gift-bounce 1.4s infinite; filter: drop-shadow(0 0 8px #f59e0b); }

        @keyframes coin-pop {
            0%   { transform: translateY(0) scale(1); opacity: 1; }
            60%  { transform: translateY(-38px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
        }
        .coin-pop { animation: coin-pop 0.7s ease-out forwards; pointer-events: none; }

        /* Modal overlay */
        #daily-modal { display: none; }
        #daily-modal.open { display: flex; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ===== MODAL RECOMPENSA DIÁRIA ===== -->
    <div id="daily-modal" class="fixed inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-800 border border-yellow-500/40 rounded-2xl shadow-2xl w-80 p-6 text-center relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-500 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div class="text-5xl mb-2" id="modal-emoji">🎁</div>
            <h2 class="text-lg font-bold text-yellow-400" id="modal-title">Recompensa Diária!</h2>
            <p class="text-slate-400 text-sm mt-1" id="modal-desc">Você ganhou sua recompensa de hoje.</p>

            <!-- Streak de dias -->
            <div class="mt-4 mb-3">
                <p class="text-xs text-slate-500 mb-2">Sequência de dias</p>
                <div class="flex justify-center gap-1" id="streak-dots"></div>
            </div>

            <div class="bg-slate-900 rounded-xl py-3 px-4 mb-4">
                <p class="text-slate-400 text-xs">Você recebeu</p>
                <p class="text-3xl font-extrabold text-yellow-400" id="modal-reward">+0.00</p>
                <p class="text-blue-400 text-sm font-semibold">L$</p>
            </div>

            <button onclick="claimReward()" id="btn-claim" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-xl transition-colors text-sm">
                🎉 Coletar Recompensa
            </button>
            <p id="modal-next" class="text-slate-500 text-xs mt-2 hidden"></p>
        </div>
    </div>

    <!-- ===== APP PRINCIPAL ===== -->
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        
        <!-- Header -->
        <div class="bg-slate-900 p-6 border-b border-slate-700 text-center relative">
            <div id="connection-status" class="absolute top-4 right-4 flex items-center text-xs text-yellow-500">
                <i data-lucide="wifi" class="w-3 h-3 mr-1"></i> Conectando...
            </div>

            <!-- Botão presente (canto esquerdo do header) -->
            <div class="absolute top-3 left-4">
                <button id="btn-gift" onclick="openModal()" class="relative flex flex-col items-center group">
                    <div id="gift-icon-wrap" class="text-2xl leading-none">🎁</div>
                    <!-- Badge de streak -->
                    <span id="streak-badge" class="text-[9px] font-bold text-yellow-300 mt-0.5 leading-none"></span>
                    <!-- Bolinha vermelha "disponível" -->
                    <span id="gift-dot" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-slate-900 hidden"></span>
                </button>
            </div>

            <h1 class="text-2xl font-bold text-blue-400 flex items-center justify-center gap-2">
                <i data-lucide="wallet"></i> PeerWallet
            </h1>
            <p class="text-slate-400 text-sm mt-1">Rede P2P WebRTC</p>
            
            <div class="mt-6">
                <p class="text-slate-400 text-sm">Saldo Total</p>
                <h2 class="text-4xl font-extrabold text-white mt-1 relative inline-block">
                    <span id="balance-display">0.00</span> <span class="text-blue-500 text-2xl">L$</span>
                </h2>
            </div>
        </div>

        <!-- Abas -->
        <div class="flex border-b border-slate-700 bg-slate-800/50">
            <button onclick="switchTab('wallet')" id="tab-btn-wallet" class="flex-1 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-400 transition-colors">
                Carteira
            </button>
            <button onclick="switchTab('mine')" id="tab-btn-mine" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">
                Minerar
            </button>
            <button onclick="switchTab('network')" id="tab-btn-network" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors">
                Rede
            </button>
        </div>

        <!-- Conteúdo -->
        <div class="p-6 h-[420px] overflow-y-auto relative">
            
            <div id="toast" class="absolute top-2 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white text-xs px-3 py-1 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
                Mensagem
            </div>

            <!-- ABA: CARTEIRA -->
            <div id="tab-wallet" class="tab-content active space-y-6">
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Seu Peer ID (Endereço)</label>
                    <div class="flex items-center gap-2">
                        <code id="my-address" class="flex-1 bg-slate-900 p-2 rounded text-sm text-green-400 break-all select-all">Gerando...</code>
                        <button onclick="copyAddress()" class="p-2 bg-slate-700 hover:bg-slate-600 rounded transition-colors text-white">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4 text-blue-400"></i> Enviar L$
                    </h3>
                    <div class="space-y-3">
                        <input type="text" id="send-address" placeholder="Peer ID do destino..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <input type="number" id="send-amount" placeholder="Quantia 0.00" min="0.01" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <button onclick="sendFunds()" id="btn-send" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i> Enviar Agora
                        </button>
                    </div>
                </div>
            </div>

            <!-- ABA: MINERAR -->
            <div id="tab-mine" class="tab-content h-full flex flex-col items-center justify-center">
                <div id="mining-ring" class="w-44 h-44 rounded-full border-4 border-slate-700 flex flex-col items-center justify-center mb-6 transition-all duration-300">
                    <i id="mining-icon" data-lucide="cpu" class="w-10 h-10 text-slate-500 mb-2"></i>
                    <p id="mining-status" class="text-sm font-medium text-slate-400">Inativo</p>
                    <p id="mining-hashrate" class="text-xs text-slate-600 mt-1">0 H/s</p>
                </div>
                <button onclick="toggleMining()" id="btn-mine" class="w-full max-w-[200px] bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> Iniciar Mineração
                </button>
            </div>

            <!-- ABA: REDE -->
            <div id="tab-network" class="tab-content">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                        <i data-lucide="activity" class="w-4 h-4 text-blue-400"></i> Transações Recentes
                    </h3>
                    <button onclick="clearHistory()" class="text-[10px] text-slate-500 hover:text-red-400">Limpar tudo</button>
                </div>
                <div id="transaction-list" class="space-y-3">
                    <div class="text-center text-slate-500 text-sm py-8 italic">Nenhuma transação.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // ===== CONFIGURAÇÕES =====
        const STORAGE_KEY_BALANCE   = 'peerwallet_balance';
        const STORAGE_KEY_TX        = 'peerwallet_transactions';
        const STORAGE_KEY_DAILY     = 'peerwallet_daily';       // { lastClaim: ISO-string, streak: N, claimed: bool }
        const MINING_REWARD         = 0.50;
        const MINING_TIME_MS        = 5000;

        // Recompensas por streak (dia 1 ao 7, depois repete o bônus do dia 7)
        const DAILY_REWARDS = [1.00, 1.50, 2.00, 2.50, 3.00, 4.00, 7.00];

        // ===== ESTADO =====
        let balance      = parseFloat(localStorage.getItem(STORAGE_KEY_BALANCE)) || 0.00;
        let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY_TX))      || [];
        let dailyData    = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY))   || { lastClaim: null, streak: 0 };
        let myPeerId     = null;
        let peer         = null;
        let isMining     = false;
        let miningInterval = null;

        // ===== ELEMENTOS =====
        const elBalance         = document.getElementById('balance-display');
        const elMyAddress       = document.getElementById('my-address');
        const elConnStatus      = document.getElementById('connection-status');
        const elTransactionList = document.getElementById('transaction-list');

        // ===== INICIALIZAÇÃO =====
        function init() {
            updateBalanceUI();
            renderTransactions();
            initPeer();
            checkDailyReward();
        }

        function initPeer() {
            peer = new Peer({ debug: 1 });
            peer.on('open', (id) => {
                myPeerId = id;
                elMyAddress.textContent = id;
                updateStatus('Conectado', 'text-green-500', 'check-circle');
            });
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'TRANSFER') receiveFunds(data.amount, conn.peer);
                });
            });
            peer.on('error', (err) => {
                console.error(err);
                updateStatus('Erro de Rede', 'text-red-500', 'alert-circle');
            });
        }

        // ===== DIÁRIO: LÓGICA =====
        function todayStr() {
            return new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
        }

        function checkDailyReward() {
            const today      = todayStr();
            const lastClaim  = dailyData.lastClaim;
            const yesterday  = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

            // Resetar streak se pulou um dia
            if (lastClaim && lastClaim !== yesterday && lastClaim !== today) {
                dailyData.streak = 0;
            }

            const available = lastClaim !== today;
            updateGiftUI(available);

            // Abrir modal automaticamente na primeira vez do dia
            if (available) openModal();
        }

        function updateGiftUI(available) {
            const wrap  = document.getElementById('gift-icon-wrap');
            const dot   = document.getElementById('gift-dot');
            const badge = document.getElementById('streak-badge');

            badge.textContent = dailyData.streak > 0 ? `🔥 ${dailyData.streak}d` : '';

            if (available) {
                wrap.classList.add('gift-ready');
                dot.classList.remove('hidden');
            } else {
                wrap.classList.remove('gift-ready');
                dot.classList.add('hidden');
            }
        }

        function openModal() {
            const today     = todayStr();
            const available = dailyData.lastClaim !== today;
            const modal     = document.getElementById('daily-modal');
            const btnClaim  = document.getElementById('btn-claim');
            const nextInfo  = document.getElementById('modal-next');

            // Qual recompensa o usuário vai ganhar agora
            const nextStreak = available ? Math.min(dailyData.streak + 1, DAILY_REWARDS.length) : dailyData.streak;
            const reward     = DAILY_REWARDS[nextStreak - 1] || DAILY_REWARDS[DAILY_REWARDS.length - 1];

            document.getElementById('modal-reward').textContent = `+${reward.toFixed(2)}`;
            renderStreakDots(nextStreak);

            if (available) {
                document.getElementById('modal-emoji').textContent = nextStreak >= 7 ? '🏆' : '🎁';
                document.getElementById('modal-title').textContent = nextStreak >= 7 ? 'Bônus Máximo!' : `Dia ${nextStreak} de Sequência!`;
                document.getElementById('modal-desc').textContent  = 'Clique para coletar sua recompensa de hoje.';
                btnClaim.disabled   = false;
                btnClaim.className  = 'w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-xl transition-colors text-sm';
                btnClaim.textContent = '🎉 Coletar Recompensa';
                nextInfo.classList.add('hidden');
            } else {
                document.getElementById('modal-emoji').textContent = '✅';
                document.getElementById('modal-title').textContent = 'Já coletado hoje!';
                document.getElementById('modal-desc').textContent  = 'Volte amanhã para continuar sua sequência.';
                btnClaim.disabled   = true;
                btnClaim.className  = 'w-full bg-slate-700 text-slate-500 font-bold py-3 rounded-xl text-sm cursor-not-allowed';
                btnClaim.textContent = '✓ Recompensa coletada';
                nextInfo.textContent = `Próxima recompensa: +${DAILY_REWARDS[Math.min(dailyData.streak, DAILY_REWARDS.length - 1)].toFixed(2)} L$ amanhã`;
                nextInfo.classList.remove('hidden');
            }

            modal.classList.add('open');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('daily-modal').classList.remove('open');
        }

        function claimReward() {
            const today    = todayStr();
            if (dailyData.lastClaim === today) return;

            // Avançar streak
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            if (dailyData.lastClaim === yesterday) {
                dailyData.streak = Math.min(dailyData.streak + 1, DAILY_REWARDS.length);
            } else {
                dailyData.streak = 1;
            }
            dailyData.lastClaim = today;
            localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyData));

            const reward = DAILY_REWARDS[dailyData.streak - 1] || DAILY_REWARDS[DAILY_REWARDS.length - 1];

            addFunds(reward);
            addTransaction('daily', reward, `Recompensa Diária (Dia ${dailyData.streak})`);
            showToast(`+${reward.toFixed(2)} L$ coletado! 🎁`);
            updateGiftUI(false);
            spawnCoinPop(reward);
            closeModal();
        }

        function renderStreakDots(currentStreak) {
            const container = document.getElementById('streak-dots');
            container.innerHTML = '';
            for (let i = 1; i <= DAILY_REWARDS.length; i++) {
                const dot = document.createElement('div');
                const filled = i <= currentStreak;
                dot.className = `w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border-2 transition-all
                    ${filled ? 'bg-yellow-400 border-yellow-300 text-slate-900' : 'bg-slate-700 border-slate-600 text-slate-500'}`;
                dot.textContent = i === 7 ? '👑' : i;
                // Tooltip de recompensa
                dot.title = `Dia ${i}: +${DAILY_REWARDS[i-1].toFixed(2)} L$`;
                container.appendChild(dot);
            }
        }

        // Moeda voando do presente ao clicar
        function spawnCoinPop(amount) {
            const btn   = document.getElementById('btn-gift');
            const rect  = btn.getBoundingClientRect();
            const span  = document.createElement('span');
            span.className   = 'coin-pop fixed z-[999] text-yellow-400 font-bold text-sm pointer-events-none';
            span.textContent = `+${amount.toFixed(2)} L$`;
            span.style.left  = `${rect.left + rect.width / 2}px`;
            span.style.top   = `${rect.top}px`;
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 800);
        }

        // ===== PERSISTÊNCIA =====
        function saveToLocal() {
            localStorage.setItem(STORAGE_KEY_BALANCE, balance.toString());
            localStorage.setItem(STORAGE_KEY_TX, JSON.stringify(transactions));
        }

        function updateBalanceUI() {
            elBalance.textContent = balance.toFixed(2);
            saveToLocal();
        }

        function addFunds(amount)    { balance += amount; updateBalanceUI(); }
        function removeFunds(amount) { balance -= amount; updateBalanceUI(); }

        // ===== CARTEIRA =====
        function sendFunds() {
            const dest   = document.getElementById('send-address').value.trim();
            const amount = parseFloat(document.getElementById('send-amount').value);
            const btn    = document.getElementById('btn-send');

            if (!dest || isNaN(amount) || amount <= 0) return showToast("Dados inválidos.", true);
            if (amount > balance) return showToast("Saldo insuficiente.", true);
            if (dest === myPeerId) return showToast("Destinatário inválido.", true);

            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Conectando...`;
            btn.disabled = true;
            lucide.createIcons();

            const conn = peer.connect(dest);
            conn.on('open', () => {
                removeFunds(amount);
                conn.send({ type: 'TRANSFER', amount });
                addTransaction('send', amount, dest);
                showToast(`Enviado ${amount} L$!`);
                document.getElementById('send-address').value = '';
                document.getElementById('send-amount').value  = '';
                btn.innerHTML = originalHtml;
                btn.disabled  = false;
                lucide.createIcons();
                setTimeout(() => conn.close(), 1000);
            });

            setTimeout(() => {
                if (!conn.open) {
                    btn.innerHTML = originalHtml;
                    btn.disabled  = false;
                    lucide.createIcons();
                    showToast("Destinatário offline.", true);
                }
            }, 5000);
        }

        function receiveFunds(amount, from) {
            addFunds(amount);
            addTransaction('receive', amount, from);
            showToast(`Recebido ${amount} L$!`);
        }

        // ===== MINERAÇÃO =====
        function toggleMining() {
            const btn      = document.getElementById('btn-mine');
            const ring     = document.getElementById('mining-ring');
            const icon     = document.getElementById('mining-icon');
            const status   = document.getElementById('mining-status');
            const hashrate = document.getElementById('mining-hashrate');

            if (isMining) {
                clearInterval(miningInterval);
                isMining = false;
                btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i> Iniciar Mineração`;
                btn.className = "w-full max-w-[200px] bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2";
                ring.classList.remove('mining-active', 'border-emerald-500');
                icon.classList.remove('text-emerald-500', 'animate-spin');
                status.textContent   = "Inativo";
                hashrate.textContent = "0 H/s";
            } else {
                isMining = true;
                btn.innerHTML = `<i data-lucide="square" class="w-4 h-4"></i> Parar Equipamento`;
                btn.className = "w-full max-w-[200px] bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-lg flex items-center justify-center gap-2";
                ring.classList.add('mining-active', 'border-emerald-500');
                icon.classList.add('text-emerald-500');
                status.textContent = "Minerando...";

                miningInterval = setInterval(() => {
                    hashrate.textContent = Math.floor(Math.random() * 100 + 150) + " MH/s";
                    addFunds(MINING_REWARD);
                    addTransaction('mine', MINING_REWARD, 'Sistema (Block Reward)');
                }, MINING_TIME_MS);
            }
            lucide.createIcons();
        }

        // ===== HISTÓRICO =====
        function addTransaction(type, amount, address) {
            transactions.unshift({
                id: Date.now(), type, amount, address,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            if (transactions.length > 20) transactions.pop();
            renderTransactions();
            saveToLocal();
        }

        function renderTransactions() {
            if (transactions.length === 0) {
                elTransactionList.innerHTML = '<div class="text-center text-slate-500 text-sm py-8 italic">Nenhuma transação.</div>';
                return;
            }
            elTransactionList.innerHTML = '';
            transactions.forEach(tx => {
                const isDaily = tx.type === 'daily';
                const color   = tx.type === 'send' ? 'text-red-400' : (isDaily ? 'text-yellow-400' : 'text-emerald-400');
                const icon    = tx.type === 'send' ? 'arrow-up-right' : (tx.type === 'mine' ? 'pickaxe' : (isDaily ? 'gift' : 'arrow-down-left'));
                const sign    = tx.type === 'send' ? '-' : '+';

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-slate-900/60 rounded-lg border border-slate-700/30";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-slate-800 rounded-lg"><i data-lucide="${icon}" class="w-4 h-4 ${color}"></i></div>
                        <div>
                            <p class="text-xs font-bold text-white uppercase">${isDaily ? 'Diário' : tx.type}</p>
                            <p class="text-[10px] text-slate-500">${tx.address.substring(0, 18)}...</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold ${color}">${sign}${tx.amount.toFixed(2)} L$</p>
                        <p class="text-[10px] text-slate-600">${tx.time}</p>
                    </div>
                `;
                elTransactionList.appendChild(div);
            });
            lucide.createIcons();
        }

        function clearHistory() {
            transactions = [];
            renderTransactions();
            saveToLocal();
        }

        // ===== UI =====
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('button[id^="tab-btn-"]').forEach(el => {
                el.classList.remove('border-blue-500', 'text-blue-400');
                el.classList.add('border-transparent', 'text-slate-400');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
            const btn = document.getElementById(`tab-btn-${tabId}`);
            btn.classList.add('border-blue-500', 'text-blue-400');
        }

        function copyAddress() {
            if (!myPeerId) return;
            const temp = document.createElement("input");
            temp.value = myPeerId;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            showToast("ID Copiado!");
        }

        function showToast(msg, error = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `absolute top-2 left-1/2 transform -translate-x-1/2 text-white text-xs px-3 py-1 rounded-full shadow-lg transition-opacity duration-300 z-50 ${error ? 'bg-red-600' : 'bg-blue-600'}`;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        function updateStatus(txt, cls, ico) {
            elConnStatus.innerHTML = `<i data-lucide="${ico}" class="w-3 h-3 mr-1"></i> ${txt}`;
            elConnStatus.className = `absolute top-4 right-4 flex items-center text-xs ${cls}`;
            lucide.createIcons();
        }

        window.onload = init;
    </script>
</body>
